[project]
name = "uc-perf-tests"
version = "0.1.0"
description = "Performance tests for Neo4j federation through Databricks Unity Catalog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["unit_tests"]
